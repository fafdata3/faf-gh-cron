name: faf-sync

on:
  schedule:
    # DESHABILITADO TEMPORALMENTE (2026-10-21) mientras se completa el
    # relleno de 2026-2027 por calendario: los runs programados cancelaban los
    # despachos manuales pendientes (mismo grupo de concurrencia).
    # Cron anual inofensivo como placeholder (GitHub no acepta `schedule:` vacio).
    # REACTIVAR al terminar:  - cron: '23 */2 * * *'  - cron: '46 */2 * * *'
    - cron: '7 4 1 1 *'
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: 'Solo regenerar/desplegar (sin descargar)'
        type: boolean
        default: false
      repair_cards:
        description: 'Podar tarjetas-espuria (footer web) del corpus y desplegar'
        type: boolean
        default: false
      sources:
        description: 'Fuentes (csv, ej: euskadi,bizkaia). Vacío = todas'
        type: string
        default: ''
      max_per_run:
        description: 'Actas máx. por fuente en esta pasada'
        type: string
        default: '60'
      m7_max:
        description: 'Presupuesto Selenium: actas TOTALES por pasada'
        type: string
        default: '24'
      budget_sec:
        description: 'Presupuesto de tiempo por pasada en segundos'
        type: string
        default: '1500'
      solo_fronte:
        description: 'Chequeo de temporada: fronte + barrido de huecos varados bajo el high'
        type: boolean
        default: false
      season_edge:
        description: 'Barrido temporada: IDs que se sondean en la CABEZA y COLA de cada hueco (default 8)'
        type: string
        default: ''
      season_hole:
        description: 'Barrido temporada: huecos <= N IDs se sondean enteros; y COLA de los grandes (default 16)'
        type: string
        default: ''
      season_sweep:
        description: 'Barrido temporada: máx. candidatos por fuente y pasada (default 600)'
        type: string
        default: ''
      targets:
        description: 'Sondeo dirigido: ids o rangos a-b (csv) a probar PRIMERO, p.ej. 10053180-10053187'
        type: string
        default: ''
      probe_portal:
        description: 'Volcar el calendario de los portales (HTML+enlaces) como artefacto'
        type: boolean
        default: false
      probe_source:
        description: 'Fuente para el volcado de calendario (vacío = todas)'
        type: string
        default: ''
      probe_max_comp:
        description: 'Máx. de competiciones por fuente en la enumeración (0 = todas)'
        type: string
        default: '0'
      probe_workers:
        description: 'Nº de Chrome en paralelo para las páginas de jornada'
        type: string
        default: '2'
      probe_debug_urls:
        description: 'URLs a sondear (una por línea) para depurar el portal'
        type: string
        default: ''

concurrency:
  group: faf-sync
  cancel-in-progress: false

permissions:
  contents: none

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clonar runner privado (faf-runner)
        run: |
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/faf-runner.git" \
            runner

      - name: Dependencias
        run: |
          cd runner
          pip install --quiet -r requirements.txt

      - name: Instalar Chrome + chromedriver (Selenium Modo 7)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Exponer ruta de Chrome
        run: |
          CHROME_BIN=$(find /opt/hostedtoolcache/setup-chrome -name 'chrome' -type f 2>/dev/null | head -1)
          if [ -z "$CHROME_BIN" ]; then CHROME_BIN=$(command -v google-chrome || true); fi
          if [ -n "$CHROME_BIN" ]; then
            echo "CHROME_BIN=$CHROME_BIN" | tee -a $GITHUB_ENV
          fi
          CHROME_VER=$("$CHROME_BIN" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Chrome: $CHROME_BIN ($CHROME_VER)"

      - name: Descargar chromedriver del mismo build (Selenium Modo 7)
        run: |
          CHROME_BIN="$CHROME_BIN"
          CHROME_VER=$("$CHROME_BIN" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "chrome-version=$CHROME_VER"
          if [ -z "$CHROME_VER" ]; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/driver"
          curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VER/linux64/chromedriver-linux64.zip" \
            -o "$RUNNER_TEMP/driver/cd.zip"
          cd "$RUNNER_TEMP/driver" && unzip -q -o cd.zip
          DRV=$(find "$RUNNER_TEMP/driver" -name chromedriver -type f | head -1)
          chmod 755 "$DRV"
          echo "CHROMEDRIVER=$DRV" | tee -a $GITHUB_ENV
          "$DRV" --version

      - name: Configurar env de Pages (Supabase para /api/config)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: faf-stats
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}"
          CUR=$(curl -s "$BASE" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          BODY=$(echo "$CUR" | jq -c --arg u "$SUPABASE_URL" --arg k "$SUPABASE_SERVICE_KEY" '
            (.result.deployment_configs // {}) as $dc
            | {
                deployment_configs: {
                  production: (($dc.production // {}) | .env_vars = ((.env_vars // {}) + {SUPABASE_URL:{value:$u}, SUPABASE_SERVICE_KEY:{value:$k}})),
                  preview:    (($dc.preview    // {}) | .env_vars = ((.env_vars // {}) + {SUPABASE_URL:{value:$u}, SUPABASE_SERVICE_KEY:{value:$k}}))
                }
              }')
          RESP=$(curl -s -X PATCH "$BASE" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" -d "$BODY")
          if echo "$RESP" | jq -e '.success' >/dev/null 2>&1; then
            echo "env de Pages configurado (SUPABASE_URL, SUPABASE_SERVICE_KEY)"
          else
            echo "::warning::No se pudo configurar env de Pages"
            echo "$RESP" | head -c 800
          fi

      - name: "Subir reglas club/filiales a Supabase (config: faf_club_map)"
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          F="runner/blobs/data/club_map.json"
          if [ ! -f "$F" ]; then echo "::warning::no existe $F (se omite)"; exit 0; fi
          BODY=$(jq -cn --slurpfile m "$F" '{key:"faf_club_map", value:$m[0]}')
          CODE=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
            "${SUPABASE_URL}/rest/v1/config?on_conflict=key" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "$BODY")
          if [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || [ "$CODE" = "204" ]; then
            echo "faf_club_map subido a Supabase (HTTP $CODE)"
          else
            echo "::warning::upsert club_map HTTP $CODE"; head -c 400 /tmp/up.json
          fi

      - name: Volcar calendario de portales (diagnóstico)
        if: ${{ inputs.probe_portal }}
        env:
          CHROME_BIN: ${{ env.CHROME_BIN }}
          CHROMEDRIVER: ${{ env.CHROMEDRIVER }}
          FAF_MONOLITO: ${{ github.workspace }}/runner/blobs/FUT_stats_fixed.py
          FAF_FAFSTATS_DIR: ${{ github.workspace }}/runner/blobs
          FAF_DATA_DIR: ${{ github.workspace }}/data
          FAF_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          cd runner
          python portal_cal.py --dump --out "$RUNNER_TEMP/portal/cal" --source "${{ inputs.probe_source }}" || true
          ARGS=""
          if [ -n "${{ inputs.probe_debug_urls }}" ]; then
            while IFS= read -r u; do
              [ -z "$u" ] && continue
              ARGS="$ARGS --debug-url $u"
            done <<< "${{ inputs.probe_debug_urls }}"
          fi
          python portal_enum2.py --out "$RUNNER_TEMP/portal/enum" --source "${{ inputs.probe_source }}" --temporada "2026-2027" --max-pages 600 --sleep 1.2 --save-html 8 --max-competitions ${{ inputs.probe_max_comp || '0' }} --workers ${{ inputs.probe_workers || '2' }} $ARGS

      - name: Subir artefacto del calendario
        if: ${{ inputs.probe_portal && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: portal-cal
          path: ${{ runner.temp }}/portal
          retention-days: 7

      - name: Sync y deploy
        if: ${{ !inputs.probe_portal }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: faf-stats
          FAF_DATA_DIR: ${{ github.workspace }}/data
          FAF_BUILD_DIR: ${{ github.workspace }}/build
          FAF_FAFSTATS_DIR: ${{ github.workspace }}/runner/blobs
          FAF_MONOLITO: ${{ github.workspace }}/runner/blobs/FUT_stats_fixed.py
          FAF_M7: '1'
          # Con Selenium el ritmo ya es humano (0.3–1.3 s/acta en dl.descargar);
          # FAF_PACING solo se aplica al fallback HTTP. 8s evita auto-bloqueo
          # del fallback (2s quemaba el presupuesto con 200 vacíos).
          FAF_PACING: '8'
          FAF_MAX_PER_RUN: ${{ inputs.max_per_run }}
          FAF_NEW_WINDOW: '30'
          # Barrido de temporada (solo_fronte): por defecto 8/16/600. Para
          # recuperar jornadas varadas pegadas al fondo de un hueco grande
          # (varias jornadas seguidas) se sube season_edge/hole/sweep.
          FAF_SEASON_EDGE: ${{ inputs.season_edge || '8' }}
          FAF_SEASON_HOLE_MAX: ${{ inputs.season_hole || '16' }}
          FAF_SEASON_SWEEP_MAX: ${{ inputs.season_sweep || '600' }}
          # Sondeo dirigido: ids/rangos concretos a probar los primeros.
          FAF_TARGET_IDS: ${{ inputs.targets }}
          FAF_M7_MAX_PER_RUN: ${{ inputs.m7_max || '24' }}
          # Con Chrome los bloqueos son raros; pausa fuerte más corta que la del
          # escritorio (15 min) por el presupuesto de la pasada (FAF_RUN_BUDGET).
          FAF_M7_PAUSA_LARGA: '300'
          # Presupuesto por pasada: con Selenium la descarga es ~1-2 s/acta y hay
          # 8 fuentes; 480s (default) se quedaba corto. 25 min cubre todas.
          FAF_RUN_BUDGET_SEC: ${{ inputs.budget_sec || '1500' }}
          FAF_SYNC_GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd runner
          if [ "${{ github.event.inputs.repair_cards }}" = "true" ]; then
            python sync_all.py --repair-cards
          elif [ "${{ github.event.inputs.rebuild_only }}" = "true" ]; then
            python sync_all.py --rebuild-only
          elif [ "${{ github.event.inputs.solo_fronte }}" = "true" ]; then
            ARGS=""
            if [ "${{ github.event.inputs.sources }}" != "" ]; then
              ARGS="--sources ${{ github.event.inputs.sources }}"
            fi
            python sync_all.py --once --bootstrap --solo-fronte $ARGS
          else
            ARGS=""
            if [ "${{ github.event.inputs.sources }}" != "" ]; then
              ARGS="--sources ${{ github.event.inputs.sources }}"
            fi
            python sync_all.py --once --bootstrap $ARGS
          fi
