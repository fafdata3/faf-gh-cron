name: faf-sync

on:
  schedule:
    # Cada 2 h (UTC), a :23 y :46 para no chocar con los arranques masivos de GH
    - cron: '23 */2 * * *'
    - cron: '46 */2 * * *'
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: 'Solo regenerar/desplegar (sin descargar)'
        type: boolean
        default: false

concurrency:
  group: faf-sync
  cancel-in-progress: false

permissions:
  contents: none

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clonar runner privado (faf-runner)
        run: |
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/faf-runner.git" \
            runner

      - name: Dependencias
        run: |
cd runner
          pip install --quiet -r requirements.txt

      - name: Chrome + chromedriver (Chrome for Testing, mismo build)
        run: |
          set -e
          curl -fsSL "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json" -o /tmp/g.json
          python3 - <<'PY'
          import json, urllib.request, zipfile
          d = json.load(open('/tmp/g.json'))
          v = d['channels']['Stable']['version']
          print('Chrome for Testing:', v)
          base = f'https://storage.googleapis.com/chrome-for-testing-public/{v}/linux64/'
          for name, out in (('chrome-linux64.zip', '/tmp/chrome.zip'),
                            ('chromedriver-linux64.zip', '/tmp/cd.zip')):
              print('descargando', name)
              urllib.request.urlretrieve(base + name, out)
          zipfile.ZipFile('/tmp/chrome.zip').extractall('/tmp/cft')
          zipfile.ZipFile('/tmp/cd.zip').extractall('/tmp/cft')
          PY
          mkdir -p "$HOME/chrome"
          cp -r /tmp/cft/chrome-linux64 "$HOME/chrome/"
          cp /tmp/cft/chromedriver-linux64/chromedriver "$HOME/chrome/"
          chmod +x "$HOME/chrome/chrome-linux64/chrome" "$HOME/chrome/chromedriver"
          "$HOME/chrome/chrome-linux64/chrome" --version
          "$HOME/chrome/chromedriver" --version

      - name: Sync y deploy
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: faf-stats
          FAF_DATA_DIR: ${{ github.workspace }}/data
          FAF_BUILD_DIR: ${{ github.workspace }}/build
          FAF_FAFSTATS_DIR: ${{ github.workspace }}/runner/blobs
          FAF_MONOLITO: ${{ github.workspace }}/runner/blobs/FUT_stats_fixed.py
          CHROME_BIN: /home/runner/chrome/chrome-linux64/chrome
          CHROMEDRIVER: /home/runner/chrome/chromedriver
          FAF_M7: '1'
        run: |
          cd runner
          if [ "${{ github.event.inputs.rebuild_only }}" = "true" ]; then
            python sync_all.py --rebuild-only
          else
            python sync_all.py --once --bootstrap
          fi
