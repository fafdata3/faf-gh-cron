name: faf-sync

on:
  schedule:
    # Cada 2 h (UTC), a :23 y :46 para no chocar con los arranques masivos de GH
    - cron: '23 */2 * * *'
    - cron: '46 */2 * * *'
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: 'Solo regenerar/desplegar (sin descargar)'
        type: boolean
        default: false
      sources:
        description: 'Fuentes (csv, ej: euskadi,bizkaia). Vacío = todas'
        type: string
        default: ''
      max_per_run:
        description: 'Actas máx. por fuente en esta pasada'
        type: string
        default: '60'

concurrency:
  group: faf-sync
  cancel-in-progress: false

permissions:
  contents: none

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clonar runner privado (faf-runner)
        run: |
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/faf-runner.git" \
            runner

      - name: Dependencias
        run: |
          cd runner
          pip install --quiet -r requirements.txt

      - name: Instalar Chrome + chromedriver (Selenium Modo 7)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Exponer ruta de Chrome
        run: |
          CHROME_BIN=$(find /opt/hostedtoolcache/setup-chrome -name 'chrome' -type f 2>/dev/null | head -1)
          if [ -z "$CHROME_BIN" ]; then CHROME_BIN=$(command -v google-chrome || true); fi
          if [ -n "$CHROME_BIN" ]; then
            echo "CHROME_BIN=$CHROME_BIN" | tee -a $GITHUB_ENV
          fi
          CHROME_VER=$("$CHROME_BIN" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Chrome: $CHROME_BIN ($CHROME_VER)"

      - name: Descargar chromedriver del mismo build (Selenium Modo 7)
        run: |
          CHROME_BIN="$CHROME_BIN"
          CHROME_VER=$("$CHROME_BIN" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "chrome-version=$CHROME_VER"
          if [ -z "$CHROME_VER" ]; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/driver"
          curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VER/linux64/chromedriver-linux64.zip" \
            -o "$RUNNER_TEMP/driver/cd.zip"
          cd "$RUNNER_TEMP/driver" && unzip -q -o cd.zip
          DRV=$(find "$RUNNER_TEMP/driver" -name chromedriver -type f | head -1)
          chmod 755 "$DRV"
          echo "CHROMEDRIVER=$DRV" | tee -a $GITHUB_ENV
          "$DRV" --version

      - name: Sync y deploy
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT_NAME: faf-stats
          FAF_DATA_DIR: ${{ github.workspace }}/data
          FAF_BUILD_DIR: ${{ github.workspace }}/build
          FAF_FAFSTATS_DIR: ${{ github.workspace }}/runner/blobs
          FAF_MONOLITO: ${{ github.workspace }}/runner/blobs/FUT_stats_fixed.py
          FAF_M7: '1'
          # Con Selenium el ritmo ya es humano (0.3–1.3 s/acta en dl.descargar);
          # FAF_PACING solo se aplica al fallback HTTP. 8s evita auto-bloqueo
          # del fallback (2s quemaba el presupuesto con 200 vacíos).
          FAF_PACING: '8'
          FAF_MAX_PER_RUN: ${{ inputs.max_per_run }}
          FAF_NEW_WINDOW: '30'
          FAF_M7_MAX_PER_RUN: '24'
          # Con Chrome los bloqueos son raros; pausa fuerte más corta que la del
          # escritorio (15 min) por el presupuesto de la pasada (FAF_RUN_BUDGET).
          FAF_M7_PAUSA_LARGA: '300'
          # Presupuesto por pasada: con Selenium la descarga es ~1-2 s/acta y hay
          # 8 fuentes; 480s (default) se quedaba corto. 25 min cubre todas.
          FAF_RUN_BUDGET_SEC: '1500'
          FAF_SYNC_GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd runner
          if [ "${{ github.event.inputs.rebuild_only }}" = "true" ]; then
            python sync_all.py --rebuild-only
          else
            ARGS=""
            if [ "${{ github.event.inputs.sources }}" != "" ]; then
              ARGS="--sources ${{ github.event.inputs.sources }}"
            fi
            python sync_all.py --once --bootstrap $ARGS
          fi
